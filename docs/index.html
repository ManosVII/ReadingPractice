<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Εξάσκηση Ανάγνωσης</title>
  <meta name="description" content="Εξάσκηση ανάγνωσης με τα κείμενα της Γλώσσας Α΄–ΣΤ΄ Δημοτικού."/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <script>
    // Make the page cross-origin isolated (coi-sw.js) so Whisper can use
    // several CPU cores; reload once after the service worker is installed.
    if (!window.crossOriginIsolated && window.isSecureContext && "serviceWorker" in navigator) {
      navigator.serviceWorker.register("coi-sw.js").then(() => {
        try {
          if (sessionStorage.getItem("coi-reloaded")) return;
          sessionStorage.setItem("coi-reloaded", "1");
        } catch { return; }
        navigator.serviceWorker.ready.then(() => location.reload());
      }).catch(() => {});
    }
  </script>
  <div id="app"></div>
  <script src="texts.js"></script>
  <script src="evaluator.js"></script>
  <script src="app.js"></script>
</body>
</html>
